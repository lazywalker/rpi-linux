# 注意：请在替换前先备份现有文件
name: Pi kernel build tests

on:
  pull_request:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*" ]
  push:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*" ]
  workflow_dispatch:

env:
  NUM_JOBS: 8

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: bcm2835
            arch: arm
            defconfig: bcm2835_defconfig
            kernel: kernel

          - name: arm64
            arch: arm64
            defconfig: defconfig
            kernel: kernel8

          - name: bcmrpi
            arch: arm
            defconfig: bcmrpi_defconfig
            kernel: kernel

          - name: bcm2709
            arch: arm
            defconfig: bcm2709_defconfig
            kernel: kernel7

          - name: bcm2711
            arch: arm64
            defconfig: bcm2711_defconfig
            kernel: kernel8

          - name: bcm2711_rt
            arch: arm64
            defconfig: bcm2711_rt_defconfig
            kernel: kernel8_rt

          - name: bcm2712
            arch: arm64
            defconfig: bcm2712_defconfig
            kernel: kernel_2712

    steps:

    - name: Install armhf crossbuild toolchain
      if: matrix.arch == 'arm'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf
      timeout-minutes: 15

    - name: Install packaging tools
      # dpkg-deb / fakeroot 用于构建 .deb
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev fakeroot
      timeout-minutes: 10

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - id: build
      name: Build kernel ${{matrix.name}}
      shell: bash
      run: |
        set -euo pipefail

        BUILD_DIR=${{github.workspace}}/build
        INSTALL_DIR=${{github.workspace}}/install
        mkdir -p "$BUILD_DIR"
        rm -rf "$INSTALL_DIR"
        mkdir -p "$INSTALL_DIR"

        export ARCH=${{matrix.arch}}
        if [[ "$ARCH" == "arm64" ]]; then
          export DTS_SUBDIR=broadcom
          export IMAGE=Image.gz
        else
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export DTS_SUBDIR=broadcom
          export IMAGE=zImage
        fi

        # Create out-of-tree config and prepare the build tree (always use O=...)
        make O="$BUILD_DIR" ${{matrix.defconfig}}

        # get kernel version from the build tree
        KERNEL_VER=$(make -s O="$BUILD_DIR" kernelrelease)
        echo "Detected kernel version: $KERNEL_VER"

        # compile image, modules and dtbs
        make O="$BUILD_DIR" -j ${{env.NUM_JOBS}} $IMAGE modules dtbs

        mkdir -p "$INSTALL_DIR/boot/firmware/overlays"
        make O="$BUILD_DIR" INSTALL_MOD_PATH="$INSTALL_DIR" modules_install

        # copy dtbs/overlays and kernel image from the out-of-tree build
        cp "$BUILD_DIR/arch/${ARCH}/boot/dts/${DTS_SUBDIR}"/*.dtb "$INSTALL_DIR/boot/firmware/" 2>/dev/null || true
        cp "$BUILD_DIR/arch/${ARCH}/boot/dts/overlays/"*.dtb* "$INSTALL_DIR/boot/firmware/overlays/" 2>/dev/null || true
        cp "${{github.workspace}}/arch/${ARCH}/boot/dts/overlays/README" "$INSTALL_DIR/boot/firmware/overlays/" 2>/dev/null || true

        cp "$BUILD_DIR/arch/${ARCH}/boot/$IMAGE" "$INSTALL_DIR/boot/firmware/${{matrix.kernel}}.img"
        cp "$BUILD_DIR/arch/${ARCH}/boot/${IMAGE}" "$INSTALL_DIR/boot/vmlinuz-${KERNEL_VER}"
        cp "$BUILD_DIR/System.map"  "$INSTALL_DIR/boot/System.map-${KERNEL_VER}"
        cp "$BUILD_DIR/.config"  "$INSTALL_DIR/boot/config-${KERNEL_VER}"

        # install headers from the out-of-tree build
        make O="$BUILD_DIR" headers_install INSTALL_HDR_PATH="$INSTALL_DIR/usr/src/linux-headers-${KERNEL_VER}"

        # export KERNEL_VER as output variable
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_OUTPUT

    - name: Tar build
      run: tar -cvf ${{matrix.name}}_build.tar.gz -C ${{github.workspace}}/install .

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{matrix.name}}_build
        path: ${{matrix.name}}_build.tar.gz
        retention-days: 90

    - name: Create .deb package (bcm2711 & bcm2712 only)
      if: matrix.name == 'bcm2711' || matrix.name == 'bcm2712'
      shell: bash
      env:
        KERNEL_VER: ${{ steps.build.outputs.KERNEL_VER }}
        PKG_NAME: "uconsole-cm-kernel"
        INSTALL_DIR: ${{github.workspace}}/install
        WORKDIR: ${{github.workspace}}/pkg
      run: |
        set -euo pipefail
        echo "Packaging kernel ${PKG_NAME} ${KERNEL_VER} for matrix ${ { matrix.name } }"

        # choosen package filename per request: uconsole-cm-kernel-<version>.deb
        OUT_DEB="${{github.workspace}}/${PKG_NAME}-${KERNEL_VER}.deb"

        # compute architecture field for control
        if [[ "${{matrix.arch}}" == "arm64" ]]; then
          PKG_ARCH="arm64"
        else
          PKG_ARCH="armhf"
        fi

        rm -rf "$WORKDIR"
        mkdir -p "$WORKDIR/DEBIAN"
        mkdir -p "$WORKDIR/boot/firmware"
        mkdir -p "$WORKDIR/lib/modules/${KERNEL_VER}"
        mkdir -p "$WORKDIR/usr/src/linux-headers-${KERNEL_VER}"

        # copy needed files into package dir
        # boot files (kernel image, vmlinuz, System.map, config)
        cp -a "${INSTALL_DIR}/boot/firmware/"* "$WORKDIR/boot/firmware/" 2>/dev/null || true
        cp -a "${INSTALL_DIR}/boot/vmlinuz-${KERNEL_VER}" "$WORKDIR/boot/vmlinuz-${KERNEL_VER}" 2>/dev/null || true
        cp -a "${INSTALL_DIR}/boot/System.map-${KERNEL_VER}" "$WORKDIR/boot/System.map-${KERNEL_VER}" 2>/dev/null || true
        cp -a "${INSTALL_DIR}/boot/config-${KERNEL_VER}" "$WORKDIR/boot/config-${KERNEL_VER}" 2>/dev/null || true

        # modules and headers
        if [ -d "${INSTALL_DIR}/lib/modules/${KERNEL_VER}" ]; then
          cp -a "${INSTALL_DIR}/lib/modules/${KERNEL_VER}" "$WORKDIR/lib/modules/"
        fi
        if [ -d "${INSTALL_DIR}/usr/src/linux-headers-${KERNEL_VER}" ]; then
          cp -a "${INSTALL_DIR}/usr/src/linux-headers-${KERNEL_VER}" "$WORKDIR/usr/src/"
        fi

        # minimal control file
        cat > "$WORKDIR/DEBIAN/control" <<EOF
Package: ${PKG_NAME}
Version: ${KERNEL_VER}
Section: kernel
Priority: optional
Architecture: ${PKG_ARCH}
Maintainer: CI <ci@users.noreply.github.com>
Description: uConsole custom kernel built for ${matrix.name} (version ${KERNEL_VER})
EOF

        # set ownership and permissions suitable for dpkg-deb
        find "$WORKDIR" -type d -exec chmod 755 {} +
        find "$WORKDIR" -type f -exec chmod 644 {} +
        chmod 755 "$WORKDIR/boot" || true

        # build deb (fakeroot ensures sane metadata)
        fakeroot dpkg-deb --build "$WORKDIR" "$OUT_DEB"

        echo "Built deb: $OUT_DEB"
      timeout-minutes: 20

    - name: Create GitHub release (bcm2711 & bcm2712 only)
      if: matrix.name == 'bcm2711' || matrix.name == 'bcm2712'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.build.outputs.KERNEL_VER }}-${{ matrix.name }}
        release_name: uconsole-cm-kernel-${{ steps.build.outputs.KERNEL_VER }}-${{ matrix.name }}
        body: Built kernel ${{ matrix.name }} version ${{ steps.build.outputs.KERNEL_VER }}
        draft: false
        prerelease: false

    - name: Upload .deb to GitHub Release (bcm2711 & bcm2712 only)
      if: matrix.name == 'bcm2711' || matrix.name == 'bcm2712'
      uses: actions/upload-release-asset@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{github.workspace}}/uconsole-cm-kernel-${{ steps.build.outputs.KERNEL_VER }}.deb
        asset_name: uconsole-cm-kernel-${{ steps.build.outputs.KERNEL_VER }}.deb
        asset_content_type: application/vnd.debian.binary-package
