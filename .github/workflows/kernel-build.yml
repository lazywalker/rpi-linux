name: Pi kernel build tests

on:
  pull_request:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*" ]
  push:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*" ]
  workflow_dispatch:

env:
  NUM_JOBS: 8

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: bcm2835
            arch: arm
            defconfig: bcm2835_defconfig
            kernel: kernel

          - name: arm64
            arch: arm64
            defconfig: defconfig
            kernel: kernel8

          - name: bcmrpi
            arch: arm
            defconfig: bcmrpi_defconfig
            kernel: kernel

          - name: bcm2709
            arch: arm
            defconfig: bcm2709_defconfig
            kernel: kernel7

          - name: bcm2711
            arch: arm64
            defconfig: bcm2711_defconfig
            kernel: kernel8

          - name: bcm2711_rt
            arch: arm64
            defconfig: bcm2711_rt_defconfig
            kernel: kernel8_rt

          - name: bcm2712
            arch: arm64
            defconfig: bcm2712_defconfig
            kernel: kernel_2712

    steps:

    - name: Install armhf crossbuild toolchain
      if: matrix.arch == 'arm'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf
      timeout-minutes: 15

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - id: build
      name: Build kernel ${{ matrix.name }}
      shell: bash
      run: |
        set -euo pipefail
        BUILD_DIR=${{github.workspace}}/build
        INSTALL_DIR=${{github.workspace}}/install
        mkdir -p "$BUILD_DIR"
        rm -rf "$INSTALL_DIR"
        mkdir -p "$INSTALL_DIR"

        export ARCH=${{matrix.arch}}
        if [[ "$ARCH" == "arm64" ]]; then
          export DTS_SUBDIR=broadcom
          export IMAGE=Image.gz
        else
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export DTS_SUBDIR=broadcom
          export IMAGE=zImage
        fi

        # Configure and prepare the kernel build
        make O="$BUILD_DIR" ${{matrix.defconfig}}
        make O="$BUILD_DIR" oldconfig
        make O="$BUILD_DIR" prepare

        # Enable WERROR to catch warnings as errors
        scripts/config --file ${{github.workspace}}/build/.config --set-val CONFIG_WERROR y

        # Get kernel version
        KERNEL_VER=$(make -s O="$BUILD_DIR" kernelrelease)
        #echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_OUTPUT

        # Build the kernel, modules, and device tree blobs
        make O="$BUILD_DIR" -j ${{env.NUM_JOBS}} $IMAGE modules dtbs
        mkdir -p "$INSTALL_DIR/boot/firmware/overlays"
        make O="$BUILD_DIR" INSTALL_MOD_PATH="$INSTALL_DIR" modules_install

        # Install device tree blobs
        cp "$BUILD_DIR/arch/${ARCH}/boot/dts/${DTS_SUBDIR}"/*.dtb "$INSTALL_DIR/boot/firmware/" 2>/dev/null || true
        cp "$BUILD_DIR/arch/${ARCH}/boot/dts/overlays/"*.dtb* "$INSTALL_DIR/boot/firmware/overlays/" 2>/dev/null || true
        cp "${{github.workspace}}/arch/${ARCH}/boot/dts/overlays/README" "$INSTALL_DIR/boot/firmware/overlays/" 2>/dev/null || true

        # Install kernel image and related files
        cp "$BUILD_DIR/arch/${ARCH}/boot/$IMAGE" "$INSTALL_DIR/boot/firmware/${{matrix.kernel}}.img"
        cp "$BUILD_DIR/arch/${ARCH}/boot/${IMAGE}" "$INSTALL_DIR/boot/vmlinuz-${KERNEL_VER}"
        cp "$BUILD_DIR/System.map"  "$INSTALL_DIR/boot/System.map-${KERNEL_VER}"
        cp "$BUILD_DIR/.config"  "$INSTALL_DIR/boot/config-${KERNEL_VER}"

        # Install kernel headers
        make O="$BUILD_DIR" headers_install INSTALL_HDR_PATH="$INSTALL_DIR/usr/src/linux-headers-${KERNEL_VER}"

    - name: Tar build
      run: |
        TAR_NAME=${{ matrix.name }}_${{ steps.build.outputs.KERNEL_VER }}-${{ matrix.arch }}.tar.gz
        tar -cvzf "$TAR_NAME" -C ${{ github.workspace }}/install .

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}_${{ steps.build.outputs.KERNEL_VER }}-${{ matrix.arch }}.tar.gz
        path: ${{ matrix.name }}_${{ steps.build.outputs.KERNEL_VER }}-${{ matrix.arch }}.tar.gz
        retention-days: 90