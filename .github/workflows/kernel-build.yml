name: Pi kernel build tests

on:
  pull_request:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*" ]
  push:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*" ]
  workflow_dispatch:

env:
  NUM_JOBS: 6

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: bcm2835
            arch: arm
            defconfig: bcm2835_defconfig
            kernel: kernel

          - name: arm64
            arch: arm64
            defconfig: defconfig
            kernel: kernel8

          - name: bcmrpi
            arch: arm
            defconfig: bcmrpi_defconfig
            kernel: kernel

          - name: bcm2709
            arch: arm
            defconfig: bcm2709_defconfig
            kernel: kernel7

          - name: bcm2711
            arch: arm64
            defconfig: bcm2711_defconfig
            kernel: kernel8

          - name: bcm2711_rt
            arch: arm64
            defconfig: bcm2711_rt_defconfig
            kernel: kernel8_rt

          - name: bcm2712
            arch: arm64
            defconfig: bcm2712_defconfig
            kernel: kernel_2712

    steps:
    # - name: Install toolchain
    #   run: |
    #     sudo apt-get update
    #     sudo apt install -y build-essential \
    #            linux-headers-generic
    #     sudo apt install -y git \
    #            bc \
    #            bison \
    #            flex \
    #            libssl-dev \
    #            make \
    #            libc6-dev \
    #            libncurses5-dev
    #     sudo apt install -y libncurses-dev \
    #            gawk \
    #            openssl \
    #            libssl-dev \
    #            dkms \
    #            libelf-dev \
    #            libudev-dev \
    #            libpci-dev \
    #            libiberty-dev \
    #            autoconf \
    #            llvm
    #   timeout-minutes: 15
      
    - name: Install armhf crossbuild toolchain
      if: matrix.arch == 'arm'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf
      timeout-minutes: 15

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Build kernel ${{matrix.name}}
      run: |
        mkdir ${{github.workspace}}/build
        export ARCH=${{matrix.arch}}
        if [[ "$ARCH" == "arm64" ]]; then
          export DTS_SUBDIR=broadcom
          export IMAGE=Image.gz
        else
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export DTS_SUBDIR=broadcom
          export IMAGE=zImage
        fi
        make O=${{github.workspace}}/build ${{matrix.defconfig}}
        #scripts/config --file ${{github.workspace}}/build/.config --set-val CONFIG_WERROR y
        make O=${{github.workspace}}/build -j ${{env.NUM_JOBS}} $IMAGE modules dtbs
        mkdir -p ${{github.workspace}}/install/boot/overlays
        make O=${{github.workspace}}/build INSTALL_MOD_PATH=${{github.workspace}}/install modules_install
        cp ${{github.workspace}}/build/arch/${ARCH}/boot/dts/${DTS_SUBDIR}/*.dtb ${{github.workspace}}/install/boot/
        cp ${{github.workspace}}/build/arch/${ARCH}/boot/dts/overlays/*.dtb* ${{github.workspace}}/install/boot/overlays/
        cp ${{github.workspace}}/arch/${ARCH}/boot/dts/overlays/README ${{github.workspace}}/install/boot/overlays/
        cp ${{github.workspace}}/build/arch/${ARCH}/boot/$IMAGE ${{github.workspace}}/install/boot/${{matrix.kernel}}.img

    - name: Tar build
      run: tar -cvf ${{matrix.name}}_build.tar -C ${{github.workspace}}/install .

    # - name: Build DEB package
    #   run: |
    #     mkdir -p ${{github.workspace}}/deb_build/DEBIAN
    #     mkdir -p ${{github.workspace}}/deb_build/boot/overlays
    #     cp -r ${{github.workspace}}/install/* ${{github.workspace}}/deb_build/ || true
    #     cat > ${{github.workspace}}/deb_build/DEBIAN/control << 'EOF'
    #     Package: linux-image-rpi-${{matrix.name}}
    #     Version: $(grep "^VERSION = " Makefile | awk '{print $3}').$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}').$(grep "^SUBLEVEL = " Makefile | awk '{print $3}')
    #     Architecture: $(if [ "${{matrix.arch}}" = "arm64" ]; then echo "arm64"; else echo "armhf"; fi)
    #     Maintainer: RPi Linux Build <build@example.com>
    #     Description: Linux kernel image and modules for Raspberry Pi (${{matrix.name}})
    #      This package contains the compiled Linux kernel image, modules, and device tree
    #      binaries for Raspberry Pi ${{matrix.name}}.
    #     EOF
    #     dpkg-deb --build ${{github.workspace}}/deb_build ${{matrix.name}}_kernel.deb

    # - name: Upload DEB artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ${{matrix.name}}_deb
    #     path: ${{matrix.name}}_kernel.deb
    #     retention-days: 90

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: ${{matrix.name}}_build
        path: ${{matrix.name}}_build.tar
        retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/cpi-')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create draft release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        tag_name: build-${{github.run_number}}-${{github.run_id}}
        name: Draft Release - Build ${{github.run_number}}
        files: artifacts/**/*.deb
        token: ${{secrets.GITHUB_TOKEN}}
