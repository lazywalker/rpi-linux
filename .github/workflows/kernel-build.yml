name: Pi kernel build tests

on:
  pull_request:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*", "uconsole-*" ]
  push:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*", "uconsole-*" ]
  workflow_dispatch:

env:
  NUM_JOBS: 8

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: bcm2835
            arch: arm
            defconfig: bcm2835_defconfig
            kernel: kernel

    steps:
    
    - name: Install armhf crossbuild toolchain
      if: matrix.arch == 'arm'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf
      timeout-minutes: 15

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Build kernel ${{matrix.name}}
      run: |
        mkdir ${{github.workspace}}/build
        export ARCH=${{matrix.arch}}
        if [[ "$ARCH" == "arm64" ]]; then
          export DTS_SUBDIR=broadcom
          export IMAGE=Image.gz
        else
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export DTS_SUBDIR=broadcom
          export IMAGE=zImage
        fi

        export BUILD_DIR="${{github.workspace}}/build"
        export INSTALL_DIR="${{github.workspace}}/install"
        export BOOT_DIR="${INSTALL_DIR}/boot"

        make clean O=${BUILD_DIR}
        make O=${BUILD_DIR} ${{matrix.defconfig}}
        make O=${BUILD_DIR} oldconfig
        #scripts/config --file ${BUILD_DIR}/.config --set-val CONFIG_WERROR y
        make O=${BUILD_DIR} -j ${{env.NUM_JOBS}} $IMAGE modules dtbs

        mkdir -p ${BOOT_DIR}/firmware/overlays
        make O=${BUILD_DIR} INSTALL_MOD_PATH=${INSTALL_DIR} modules_install
        
        export KERNEL_VER=$(make kernelrelease)

        cp ${BUILD_DIR}/arch/${ARCH}/boot/dts/${DTS_SUBDIR}/*.dtb ${BOOT_DIR}/firmware/
        cp ${BUILD_DIR}/arch/${ARCH}/boot/dts/overlays/*.dtb* ${BOOT_DIR}/firmware/overlays/
        if [[ -f "${BUILD_DIR}/arch/${ARCH}/boot/dts/overlays/README" ]]; then
          cp ${BUILD_DIR}/arch/${ARCH}/boot/dts/overlays/README ${BOOT_DIR}/firmware/overlays/
        fi
        # cp ${BUILD_DIR}/arch/${ARCH}/boot/$IMAGE ${BOOT_DIR}/${{matrix.kernel}}.img

        cp ${BUILD_DIR}/arch/${ARCH}/boot/$IMAGE ${BOOT_DIR}/vmlinuz-${KERNEL_VER}

        cp ${BUILD_DIR}/System.map  ${BOOT_DIR}/System.map-${KERNEL_VER}
        cp ${BUILD_DIR}/.config  ${BOOT_DIR}/config-${KERNEL_VER}

        make header_install INSTALL_HDR_PATH=${INSTALL_DIR}/usr/src/linux-headers-${KERNEL_VER}

    - name: Tar build
      run: |
        export INSTALL_DIR="${{github.workspace}}/install"
        tar -cvfz ${{matrix.name}}-build.tar.gz -C ${INSTALL_DIR} .

    # - name: Build DEB package
    #   run: |
    #     mkdir -p ${{github.workspace}}/deb_build/DEBIAN
    #     mkdir -p ${{github.workspace}}/deb_build/boot/overlays
    #     cp -r ${{github.workspace}}/install/* ${{github.workspace}}/deb_build/ || true
    #     cat > ${{github.workspace}}/deb_build/DEBIAN/control << 'EOF'
    #     Package: linux-image-rpi-${{matrix.name}}
    #     Version: $(grep "^VERSION = " Makefile | awk '{print $3}').$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}').$(grep "^SUBLEVEL = " Makefile | awk '{print $3}')
    #     Architecture: $(if [ "${{matrix.arch}}" = "arm64" ]; then echo "arm64"; else echo "armhf"; fi)
    #     Maintainer: RPi Linux Build <build@example.com>
    #     Description: Linux kernel image and modules for Raspberry Pi (${{matrix.name}})
    #      This package contains the compiled Linux kernel image, modules, and device tree
    #      binaries for Raspberry Pi ${{matrix.name}}.
    #     EOF
    #     dpkg-deb --build ${{github.workspace}}/deb_build ${{matrix.name}}_kernel.deb

    # - name: Upload DEB artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ${{matrix.name}}_deb
    #     path: ${{matrix.name}}_kernel.deb
    #     retention-days: 90

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: ${{matrix.name}}-build
        path: ${{matrix.name}}-build.tar.gz
        retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/cpi-')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create draft release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        tag_name: build-${{github.run_number}}-${{github.run_id}}
        name: Draft Release - Build ${{github.run_number}}
        files: artifacts/**/*.deb
        token: ${{secrets.GITHUB_TOKEN}}
